name: Repair Vercel runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Repair runtime and Vercel routing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          p = Path('index.js')
          s = p.read_text()

          old_auth = """const adminPassword = String(process.env.ADMIN_PASSWORD || '');
          const passwordFromEnv = adminPassword.length >= 12 && !/^replace-with-/i.test(adminPassword) ? adminPassword : '';
          const BUILT_IN_PASSWORD_SHA256 = '1f9b10217856ffb8312980b304e03653e008aa7824d96df254fcd4efb3753587';
          const expectedPasswordHash = passwordFromEnv ? crypto.createHash('sha256').update(passwordFromEnv).digest('hex') : BUILT_IN_PASSWORD_SHA256;
          const secret = crypto.createHash('sha256').update(expectedPasswordHash).digest();"""
          new_auth = """const adminPassword = String(process.env.ADMIN_PASSWORD || '');
          const passwordConfigured = adminPassword.length >= 12 && !/^replace-with-/i.test(adminPassword);
          const expectedPasswordHash = passwordConfigured ? crypto.createHash('sha256').update(adminPassword).digest('hex') : '';
          const secret = crypto.createHash('sha256').update(expectedPasswordHash || 'durga-cms-unconfigured-secret').digest();"""
          if old_auth not in s:
              raise SystemExit('auth configuration marker not found')
          s = s.replace(old_auth, new_auth, 1)

          old_status = "app.get('/api/auth/status',(_,res)=>res.json({configured:true,setupRequired:false,authenticated:false}));"
          new_status = "app.get('/api/auth/status',(req,res)=>res.json({configured:passwordConfigured,setupRequired:!passwordConfigured,authenticated:authed(req)}));"
          if old_status not in s:
              raise SystemExit('auth status marker not found')
          s = s.replace(old_status, new_status, 1)

          old_login = "app.post('/api/auth/login',(req,res)=>{if(rateLimited(req))return res.status(429).json({error:'Too many attempts. Try again later.'});const candidate=String(req.body?.password||'');const a=crypto.createHash('sha256').update(candidate).digest();const b=Buffer.from(expectedPasswordHash,'hex');if(a.length!==b.length||!crypto.timingSafeEqual(a,b)){fail(req);return res.status(401).json({error:'Incorrect password'});}const payload=`${Date.now()}:${crypto.randomBytes(16).toString('hex')}`;setCookie(res,payload);res.json({ok:true,csrfToken:csrfFor(payload)});});"
          new_login = "app.post('/api/auth/login',(req,res)=>{if(!passwordConfigured)return res.status(503).json({error:'ADMIN_PASSWORD is not configured for this deployment.'});if(rateLimited(req))return res.status(429).json({error:'Too many attempts. Try again later.'});const candidate=String(req.body?.password||'');const a=crypto.createHash('sha256').update(candidate).digest();const b=Buffer.from(expectedPasswordHash,'hex');if(a.length!==b.length||!crypto.timingSafeEqual(a,b)){fail(req);return res.status(401).json({error:'Incorrect password'});}const payload=`${Date.now()}:${crypto.randomBytes(16).toString('hex')}`;setCookie(res,payload);res.json({ok:true,csrfToken:csrfFor(payload)});});"
          if old_login not in s:
              raise SystemExit('auth login marker not found')
          s = s.replace(old_login, new_login, 1)

          marker = "app.use((req,res,next)=>{res.setHeader('X-Content-Type-Options','nosniff');"
          if "app.use(express.static(publicDir" not in s:
              insert = "app.use(express.static(publicDir,{index:false,maxAge:'1h'}));\n"
              s = s.replace(marker, insert + marker, 1)

          p.write_text(s)

          p = Path('src/lib.js')
          s = p.read_text()
          old = "  const requestPath = path === '/api/export' && method === 'GET' ? '/api/content' : path;\n"
          if old in s:
              s = s.replace(old, '', 1)
          s = s.replace("  if (requestPath === '/api/upload'", "  if (path === '/api/upload'", 1)
          s = s.replace("fetch(requestPath,", "fetch(path,", 1)
          p.write_text(s)

          Path('vercel.json').write_text(json.dumps({
              '$schema': 'https://openapi.vercel.sh/vercel.json',
              'version': 2,
              'buildCommand': 'npm run build',
              'builds': [
                  {
                      'src': 'index.js',
                      'use': '@vercel/node',
                      'config': {'includeFiles': ['public/**']}
                  }
              ],
              'routes': [
                  {'src': '/(.*)', 'dest': '/index.js'}
              ]
          }, indent=2) + '\n')
          PY

          rm -f 'api/[...path].js'

          npm install --no-audit --no-fund
          npm run build

          test -f public/index.html

          node --input-type=module <<'NODE'
          process.env.ADMIN_PASSWORD = 'test-admin-password-12345';
          const { default: app } = await import('./index.js');
          const http = await import('node:http');
          const server = http.createServer(app);
          await new Promise(resolve => server.listen(0, resolve));
          const { port } = server.address();
          const status = await fetch(`http://127.0.0.1:${port}/api/auth/status`);
          const data = await status.json();
          if (!status.ok || data.configured !== true) throw new Error(`Auth smoke test failed: ${status.status} ${JSON.stringify(data)}`);
          const login = await fetch(`http://127.0.0.1:${port}/api/auth/login`, {
            method:'POST',
            headers:{'content-type':'application/json'},
            body:JSON.stringify({password:'wrong-password'})
          });
          if (login.status !== 401) throw new Error(`Login smoke test failed: expected 401, got ${login.status}`);
          server.close();
          NODE

      - name: Commit runtime repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js src/lib.js vercel.json 'api/[...path].js'
          git commit -m 'fix: repair Vercel Express routing and env authentication'
          git push
